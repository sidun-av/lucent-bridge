name: E2E (real Wine)

# Real Wine (and on AArch64 real FEX) running real Windows installers inside
# a Fedora container that matches the Lucent OS base release. The tests run
# with networking disabled, so anything that tries to download (Mono/Gecko
# prompts, winetricks) fails loudly instead of silently working in CI only.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Host facts
        run: uname -a; getconf PAGESIZE; nproc; free -h; docker --version

      - uses: docker/setup-buildx-action@v3

      - name: Build test image (Fedora + Lucent OS Wine/FEX package set)
        uses: docker/build-push-action@v6
        with:
          context: ci/e2e
          file: ci/e2e/Containerfile
          tags: lb-e2e:latest
          load: true
          cache-from: type=gha,scope=e2e-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.arch }}

      - name: Cache installers
        uses: actions/cache@v4
        with:
          path: apps
          key: apps-${{ hashFiles('ci/e2e/apps.tsv') }}

      - name: Download installers (pinned SHA-256)
        run: ci/e2e/fetch-apps.sh apps

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: cargo-home
          key: cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: RPM sources (git archive + vendored crates)
        run: |
          mkdir -p cargo-home
          docker run --rm -v "$PWD:/src" -v "$PWD/cargo-home:/cargo" -e CARGO_HOME=/cargo -w /src \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            lb-e2e:latest ci/rpm/sources.sh /src/dist/sources

      - name: Build the RPM offline (network disabled), as the release does
        run: |
          docker run --rm --network none -v "$PWD:/src" lb-e2e:latest \
            /src/ci/rpm/rpmbuild.sh /src/dist/sources /src/dist/rpms
          sudo chown -R "$(id -u):$(id -g)" dist cargo-home

      # Fedora Atomic keeps /var/home on btrfs mounted with compress=zstd:1;
      # give the tests the same, so `cp --reflink=auto` behaves as it would
      # on Lucent OS (the template and the homes share one file system).
      - name: btrfs scratch file system (like Fedora Atomic's /var/home)
        run: |
          sudo apt-get install -y -qq btrfs-progs
          df -h /
          sudo truncate -s 40G /mnt/lbfs.img
          sudo mkfs.btrfs -q /mnt/lbfs.img
          sudo mkdir -p /mnt/lbfs
          sudo mount -o loop,compress=zstd:1 /mnt/lbfs.img /mnt/lbfs
          for d in home-no-template home-template share-template; do sudo mkdir -p /mnt/lbfs/$d; done
          sudo chown 1001:1001 /mnt/lbfs/home-*

      # This pass also keeps Wine's own look (LUCENT_BRIDGE_APPEARANCE=off):
      # its screenshots are the "before" for the template pass's light/dark.
      - name: E2E without prefix template (network disabled, Wine's classic look)
        timeout-minutes: 30
        run: |
          mkdir -p out/no-template && chmod 777 out/no-template
          docker run --rm --network none --shm-size=1g -e LB_RPM_DIR=/rpms -e LUCENT_BRIDGE_APPEARANCE=off \
            -v "$PWD:/src:ro" -v "$PWD/apps:/apps:ro" -v "$PWD/dist/rpms:/rpms:ro" \
            -v /mnt/lbfs/home-no-template:/home/tester -v "$PWD/out/no-template:/out" \
            lb-e2e:latest bash /src/ci/e2e/container-main.sh

      - name: E2E with the prebuilt prefix template (network disabled)
        timeout-minutes: 30
        if: always()
        run: |
          mkdir -p out/template && chmod 777 out/template
          docker run --rm --network none --shm-size=1g -e LB_RPM_DIR=/rpms -e LB_TEMPLATE=1 \
            -v "$PWD:/src:ro" -v "$PWD/apps:/apps:ro" -v "$PWD/dist/rpms:/rpms:ro" \
            -v /mnt/lbfs/home-template:/home/tester -v /mnt/lbfs/share-template:/usr/share/lucent-bridge \
            -v "$PWD/out/template:/out" \
            lb-e2e:latest bash /src/ci/e2e/container-main.sh

      - name: Before/after screenshots (classic | light | dark [| own dark mode])
        if: always()
        run: |
          mkdir -p out/compare
          for app in notepadplusplus 7-zip keepass; do
            set -- out/no-template/screenshots/$app.png out/template/screenshots/$app.png out/template/screenshots/$app-dark.png
            [ -f "$1" ] && [ -f "$2" ] && [ -f "$3" ] || continue
            # Notepad++ also with its own "Follow Windows" dark mode on.
            own=out/template/screenshots/$app-dark-follow-windows.png
            [ -f "$own" ] && set -- "$@" "$own"
            files=(); for f in "$@"; do files+=("/$f"); done
            docker run --rm -v "$PWD/out:/out" lb-e2e:latest \
              convert "${files[@]}" -bordercolor white -border 4 +append "/out/compare/$app.png" || true
          done
          ls -l out/compare
      - name: Summary
        if: always()
        run: cat out/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.arch }}
          path: out
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/rpms
          if-no-files-found: warn
