[package]
name = "lucent-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run Windows programs on Lucent OS without a VM: Wine on x86-64, Wine + FEX-Emu translation on AArch64"
license = "Apache-2.0"
repository = "https://github.com/sidun-av/lucent-bridge"
readme = "README.md"
keywords = ["wine", "fex-emu", "windows", "compatibility", "linux"]
categories = ["command-line-utilities", "emulators"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ico = "0.6.0"
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
