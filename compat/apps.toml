# Lucent Bridge compatibility database — desktop applications.
#
# Each [[app]] entry is matched against a program by, in order of priority:
#   match.sha256   exact SHA-256 of the .exe/.msi (lowercase hex)
#   match.product  ProductName from the version resource (case-insensitive)
#   match.exe      file name (case-insensitive)
#
# Fields:
#   env            extra environment variables
#   dll_overrides  WINEDLLOVERRIDES entries: "native", "builtin", "native,builtin",
#                  "builtin,native" (or n / b / n,b / b,n) or "disabled"
#   verbs          winetricks verbs, applied once per prefix before first launch
#   runner         preferred runner on AArch64: "wine-fex" (default) or "fex-interpreter"
#   silent_args    installer switches for `run --silent` when the installer type's
#                  defaults (Inno, NSIS, MSI, WiX Burn) don't apply
#   status         works | partial | broken | unknown
#   native_alternative  a native Linux package worth suggesting instead
#   notes          shown in `plan` output and, for broken entries, to the user
#
# A status other than "unknown" needs evidence: "works" entries name the
# end-to-end test that installs and starts the program on both
# architectures (.github/workflows/e2e.yml, ci/e2e/tests.sh). "broken" is
# for programs that cannot work by design (kernel drivers). Everything
# else stays "unknown" until it has been tested.

# Tested: 8.9.9 x64 (32-bit NSIS installer, `run --silent`), both architectures.
[[app]]
name = "Notepad++"
match.product = ["Notepad++"]
match.exe = ["notepad++.exe"]
status = "works"

# Tested: 26.06 x64, both architectures.
[[app]]
name = "7-Zip"
match.product = ["7-Zip"]
match.exe = ["7zFM.exe", "7zG.exe"]
status = "works"
# 7-Zip's own installer (not NSIS) takes NSIS-style /S.
silent_args = ["/S"]
native_alternative = "rpm: 7zip"
notes = "Shell-extension features (Explorer context menu) are not available."

# Tested: 2.62 (32-bit Inno Setup installer, .NET Framework WinForms app),
# both architectures.
[[app]]
name = "KeePass 2"
match.product = ["KeePass Password Safe"]
match.exe = ["KeePass.exe"]
status = "works"
notes = "Runs on Wine Mono; Microsoft .NET is not needed."

[[app]]
name = "IrfanView"
match.product = ["IrfanView"]
match.exe = ["i_view64.exe", "i_view32.exe"]
status = "unknown"   # not yet tested
verbs = ["corefonts"]

[[app]]
name = "foobar2000"
match.product = ["foobar2000"]
match.exe = ["foobar2000.exe"]
status = "unknown"   # not yet tested
env = { PULSE_LATENCY_MSEC = "60" }
notes = "Uses PipeWire through Wine's PulseAudio driver; the latency hint avoids crackling."

[[app]]
name = "Microsoft Office 2016"
match.product = ["Microsoft Office 2016"]
status = "unknown"   # not yet tested
verbs = ["corefonts", "msxml6", "riched20"]
dll_overrides = { riched20 = "native,builtin", msxml6 = "native,builtin" }
notes = "Volume-licensed MSI editions install; Click-to-Run editions and online activation are unreliable."

[[app]]
name = "Adobe Photoshop CS6"
match.product = ["Adobe Photoshop CS6"]
match.exe = ["Photoshop.exe"]
status = "unknown"   # not yet tested
verbs = ["vcrun2010", "msxml6", "atmlib", "gdiplus"]
dll_overrides = { msxml6 = "native,builtin" }
notes = "GPU features (OpenGL drawing) should be turned off in Preferences > Performance."

[[app]]
name = "Telegram Desktop"
match.product = ["Telegram Desktop"]
match.exe = ["Telegram.exe"]
status = "unknown"   # not yet tested
native_alternative = "flatpak: org.telegram.desktop"
notes = "A native Linux build exists and integrates better with the desktop."
