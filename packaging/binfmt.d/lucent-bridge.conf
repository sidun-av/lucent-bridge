# Lucent Bridge: start Windows executables (files beginning with "MZ")
# directly, e.g. `./setup.exe` after `chmod +x`.
#
# The interpreter is a symlink to /usr/bin/lucent-bridge; invoked under this
# name it behaves like `lucent-bridge run -- <file> [args...]`.
#
# Note: wine-systemd ships an equivalent entry for plain `wine`. Only one of
# them should be active; the Lucent OS image does not install wine-systemd.
:LucentBridge:M::MZ::/usr/libexec/lucent-bridge/lucent-bridge-binfmt:
